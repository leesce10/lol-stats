name: Supabase Keepalive

# Vercel cron(/api/ping, 매일 03:00 UTC)의 이중화.
# 무료 Supabase는 7일 비활성 시 자동 일시정지되므로,
# GitHub Actions가 12시간 어긋난 시각에 한 번 더 ping을 호출해
# Vercel cron이 누락돼도 DB가 깨어 있도록 한다.

on:
  schedule:
    - cron: "0 15 * * *" # 매일 15:00 UTC (Vercel cron과 12h 간격)
  workflow_dispatch: # 수동 실행 가능

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase keepalive endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -sS -m 30 --retry 3 --retry-delay 10 \
            -o /tmp/ping_body.txt -w "%{http_code}" \
            "https://lol-stats-kr.vercel.app/api/ping?secret=${CRON_SECRET}")
          echo "HTTP $code"
          echo "Body: $(cat /tmp/ping_body.txt)"
          if [ "$code" != "200" ]; then
            echo "::error::Keepalive ping failed with HTTP $code"
            exit 1
          fi
